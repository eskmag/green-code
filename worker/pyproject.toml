[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greencode-worker"
version = "0.1.0"
description = "Måleworker for green-code: kjører kode og måler energi med RAPL"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
greencode-worker = "greencode_worker.cli:main"

[tool.setuptools.packages.find]
include = ["greencode_worker*"]
